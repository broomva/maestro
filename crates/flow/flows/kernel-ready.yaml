# kernel-ready@2: the flow kernel checks its own readiness (BRO-3842, the meta dogfood).
#
# pin -> suite -> installed -> mcp_tools -> stop_gate -> consumers -> exercise
#
# Each node is one readiness check, and each fails closed: a pure or work node whose command
# fails is refused, and an observe node maps only exit 0 to `pass`, so any other exit is refused
# (`exit_unmapped`) and the chain stops there.
#
# Readiness is the agents' to verify, not the owner's (owner, 2026-11-20, BRO-4044): the instance
# reaching terminal, every check accepted and the exercise attested to a provider other than the
# writer's, is the head being ready. @1 ended in an owner `ready` node after every check, which
# only ever showed the owner passing evidence to confirm; @2 has no human node, so nothing waits
# on the owner.
#
# Structure is fixed, treatment is per instance (owner directive D6, BRO-3980). The definition
# fixes what must hold and in what order; the params carry how this instance meets it: which
# suite runs on this host, which consumers this installation serves, which provider wrote the
# head (so the exercise goes to another one), and what the verifier exercises. Two instances
# with different params run the same checks, so their accepting spines compare.
#
# The nodes form one chain, so every run accepts them in the same order and `flow spine
# --against` can compare a Claude-driven run with a Codex-driven one.
#
# The machine checks live in `scripts/kernel-ready.py`, and each check node runs the script as
# committed at params.head (`git show <head>:scripts/kernel-ready.py`), never the working tree's
# copy, which could change after `pin` (P20 round 1). Placeholders are data here: the kernel fills
# them when it runs a command.
flow: kernel-ready
version: 2
# `agent:verifier` is Maestro's own agents/verifier.agent.yaml, compiled into the binary as a
# builtin (`maestro_flow::agents::BUILTIN`), so the flow declares no `agents:` root: a root holding
# the same name would be refused as a conflict with the builtin (BRO-3826).
params: [repo, head, suite, consumer, writer_provider, surface]
workdir: "{{params.repo}}"
nodes:
  # The repository is at params.head, with no tracked change; a `git status` that fails (an
  # unreadable index) fails the node rather than reading as clean.
  pin:
    class: observe
    run: [sh, -c, 'test "$(git -C "$1" rev-parse HEAD)" = "$2" && s=$(git -C "$1" status --porcelain --untracked-files=no) && test -z "$s"', pin, "{{params.repo}}", "{{params.head}}"]
    fresh_for: 2h
    inputs: [params.head]
    exit_map: {0: pass}
  # The instance's suite command at that head, run by the kernel in a snapshot of it: this proves
  # that command exits 0, no more, so the params name the command (`scripts/ci.sh`, or the
  # workspace tests on a loaded host).
  suite:
    class: pure
    needs: [pin]
    snapshot: "{{params.head}}"
    run: [sh, -c, "{{params.suite}}"]
  # ~/.local/bin/maestro, the binary the harnesses launch, was built from that head's committed
  # sources (`maestro --version`, `crates/cli/build.rs`); build configuration outside the tree
  # (Cargo config, RUSTFLAGS, the toolchain) is not recorded.
  installed:
    class: observe
    needs: [suite]
    run: [sh, -c, 's=$(git show "$1:scripts/kernel-ready.py") && exec python3 -I -c "$s" installed "$1"', installed, "{{params.head}}"]
    inputs: [params.head]
    exit_map: {0: pass}
  # Its MCP server lists every flow verb that has an MCP twin.
  mcp_tools:
    class: observe
    needs: [installed]
    run: [sh, -c, 's=$(git show "$1:scripts/kernel-ready.py") && exec python3 -I -c "$s" mcp-tools', mcp_tools, "{{params.head}}"]
    inputs: [installed]
    exit_map: {0: pass}
  # Claude Code and Codex run the Stop gate as their Stop hook, and Codex trusts it.
  stop_gate:
    class: observe
    needs: [mcp_tools]
    run: [sh, -c, 's=$(git show "$1:scripts/kernel-ready.py") && exec python3 -I -c "$s" stop-gate', stop_gate, "{{params.head}}"]
    inputs: [mcp_tools]
    exit_map: {0: pass}
  # A consumer's definitions compile, and its generated skills and agent renders match, under the
  # installed binary, checked by the script itself, never through the consumer's Makefile.
  consumers:
    class: observe
    needs: [stop_gate]
    run: [sh, -c, 's=$(git show "$1:scripts/kernel-ready.py") && exec python3 -I -c "$s" consumers "$2"', consumers, "{{params.head}}", "{{params.consumer}}"]
    inputs: [params.consumer, stop_gate]
    exit_map: {0: pass}
  # Used as a user would, by a provider other than the head's writer (BRO-3828): the kernel
  # refuses a performer whose attested provider is the writer's. The performer completes with a
  # dogfood-receipt@1 for this head and surface, which the kernel checks.
  exercise:
    class: work
    needs: [consumers]
    performer: agent:verifier
    skill: dogfood
    routing: {provider: "different_from(params.writer_provider)"}
    verify: [maestro, dogfood, verify-receipt, "--head={{params.head}}", "--surface={{params.surface}}"]
