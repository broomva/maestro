# Pilot 1, the verifier (flow kernel spec, "Pilot 1: the verifier").
#
# pin (observe) -> check (pure) -> exercise (work, only when a surface is declared).
# Placeholders such as {{params.head}}, and {{outputs.receipt}} in a work node's verify, are data
# here: the kernel fills them when it runs a command, which replay never does. The spec's `uses: [verified-finish@1]` trait waits for
# phase 2 and is left out, since the compiler refuses traits.
flow: verify
version: 1
params: [repo, head, check, surface?]
# Every command runs in the repository under check.
workdir: "{{params.repo}}"
nodes:
  # V1: the repository is at params.head; exit 0 when it is, 1 when HEAD moved.
  pin:
    class: observe
    run: [sh, -c, 'test "$(git -C "$1" rev-parse HEAD)" = "$2"', pin, "{{params.repo}}", "{{params.head}}"]
    fresh_for: 10m
    inputs: [params.head]
    exit_map: {0: at_head, 1: moved}
  # V2 and V3: the project's own check, run by the kernel, only against a pinned head that is
  # still fresh. Its exit status is the result, as long as the repository is at params.head when
  # the check starts and when it ends: a HEAD that moved while pin was still fresh fails it (125),
  # so a check never passes against a head that has since moved.
  check:
    class: pure
    needs: [pin]
    switch: {on: pin, case: at_head}
    run: [sh, -c, 'at() { test "$(git rev-parse HEAD 2>/dev/null)" = "$1" || { echo "the repository is not at $1" >&2; exit 125; }; }; at "$1"; sh -c "$2"; s=$?; at "$1"; exit "$s"', check, "{{params.head}}", "{{params.check}}"]
  # V4: whether a surface was declared, observed from the param itself (it never changes, so
  # the observation never goes stale).
  surface:
    class: observe
    run: [test, -n, "{{params.surface}}"]
    inputs: [params.surface]
    exit_map: {0: declared, 1: none}
  # V4: tried as a user, only when a surface is declared. Its verify checks the dogfood receipt
  # the performer names in its outputs ({"receipt": "<path>"}) against the pinned head and the
  # surface (`maestro_flow::dogfood`, dogfood-receipt@1). Each value is one word, after `=`, so
  # none is read as a flag.
  exercise:
    class: work
    needs: [check]
    switch: {on: surface, case: declared}
    performer: agent:verifier
    skill: dogfood
    verify: [maestro, dogfood, verify-receipt, "--receipt={{outputs.receipt}}", "--head={{params.head}}", "--surface={{params.surface}}"]
