[package]
name = "maestro-flow"
description = "The flow ledger's storage: one writer, a hash-chained event log per instance, a rebuildable SQLite projection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
jiff.workspace = true
rusqlite.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Test-only pause points (`hooks`). Off by default, so a normal build has none; the crate's own
# tests turn it on through the self dev-dependency below.
test-hooks = []

[dev-dependencies]
maestro-flow = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true

[lints]
workspace = true
