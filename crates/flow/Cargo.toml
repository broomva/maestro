[package]
name = "maestro-flow"
description = "The flow ledger and its kernel: one writer, a hash-chained event log per instance, a rebuildable SQLite projection, flow definitions and a read-only scheduler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The crate has no doc tests, and running rustdoc for none costs every mutant of the mutation
# check (scripts/mutation-check.sh runs the whole suite per mutant) seconds for nothing.
[lib]
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
jiff.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde_yaml.workspace = true
jaq-core.workspace = true
jaq-std.workspace = true
jaq-json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
