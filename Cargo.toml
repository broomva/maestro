[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/broomva/maestro"

[workspace.dependencies]
maestro-core = { path = "crates/maestro-core" }
maestro-store = { path = "crates/maestro-store" }
maestro-mcp = { path = "crates/maestro-mcp" }
anyhow = "1"
jiff = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
rmcp = { version = "1.7", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
