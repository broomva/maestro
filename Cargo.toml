[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/broomva/maestro"

[workspace.dependencies]
maestro-core = { path = "crates/core" }
maestro-store = { path = "crates/store" }
maestro-mcp = { path = "crates/mcp" }
maestro-view = { path = "crates/view" }
maestro-hosts = { path = "crates/hosts" }
anyhow = "1"
jiff = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
serde_yaml = "0.9"
yaml-rust2 = { version = "0.8", default-features = false }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal", "time"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
