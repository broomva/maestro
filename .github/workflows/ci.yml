# The required check on main (ruleset `main: required checks`) is the `ci` job. It runs the same
# gate an agent runs before a PR, scripts/ci.sh (fmt, clippy, tests, mutation, plugin parity),
# with the mutation step split across the `mutants` shards first (BRO-3446).
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mutants:
    name: mutants (${{ strategy.job-index }}/${{ strategy.job-total }})
    # Self-hosted labels (BRO-3227) never run a fork's pull request: this repository is public.
    runs-on: ${{ (vars.CI_RUNNER_LABELS && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    # Each shard runs a quarter of the mutants against the whole suite (about 250 by BRO-3203:
    # 70-90 min serial). Add shards by growing the list; the split follows it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_TERM_COLOR: always
      # Derived from the matrix, so the shards always cover every mutant.
      MUTANT_SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
    steps:
      # The job runs build scripts: keep the token out of .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/mutation-check.sh
  ci:
    name: ci
    needs: mutants
    # always(): a job skipped because a need failed reports success to a required check, so this
    # job runs anyway and its first step fails unless every shard succeeded.
    if: ${{ always() }}
    runs-on: ${{ (vars.CI_RUNNER_LABELS && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: every mutant shard passed
        env:
          MUTANTS: ${{ needs.mutants.result }}
        run: |
          echo "mutants: $MUTANTS"
          test "$MUTANTS" = success
      # The job runs build scripts and the plugin's code (parity): keep the token out of .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          # The MCP App bridge is a checked-in bun build; scripts/bridge-check.sh rebuilds it with this bun.
          bun-version: 1.4.3
      - run: bash scripts/ci.sh
        env:
          MUTANTS_SHARDED: 1
