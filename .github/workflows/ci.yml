# The required check on main (ruleset `main: required checks`). It runs the same gate an
# agent runs before a PR: scripts/ci.sh (fmt, clippy, tests, mutation, plugin parity).
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    name: ci
    # Self-hosted labels (BRO-3227) never run a fork's pull request: this repository is public.
    runs-on: ${{ (vars.CI_RUNNER_LABELS && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      # The job runs build scripts and the plugin's code (parity): keep the token out of .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # The ask validator stub (fixtures/requests) reads YAML with PyYAML, as ask_ledger.py does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml==6.0.2
      - run: bash scripts/ci.sh
